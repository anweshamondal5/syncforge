# ==============================================================================
# SyncForge — Render Blueprint Infrastructure as Code (render.yaml)
# ==============================================================================
# Deploys:
#   1. syncforge-backend: Node.js 20 Web Service (Express API + CRDT WSS Gateway)
#   2. syncforge-frontend: Static Site (CDN-distributed Vite React Client with SPA routing)
#   3. syncforge_postgres: Managed PostgreSQL 16 Database
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND WEB SERVICE (HTTP REST API + Binary WebSocket Gateway)
  # ----------------------------------------------------------------------------
  - type: web
    name: syncforge-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:server
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "https://syncforge-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: syncforge_postgres
          property: connectionString
      - key: DOC_SAVE_DEBOUNCE_MS
        value: 2000
      - key: DOC_SNAPSHOT_THRESHOLD
        value: 50

  # ----------------------------------------------------------------------------
  # 2. FRONTEND STATIC SITE (Vite React Client + Global CDN Distribution)
  # ----------------------------------------------------------------------------
  - type: web
    runtime: static
    name: syncforge-frontend
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:client
    staticPublishPath: ./packages/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://syncforge-backend-nspd.onrender.com
      - key: VITE_WS_URL
        value: wss://syncforge-backend-nspd.onrender.com

databases:
  # ----------------------------------------------------------------------------
  # 3. MANAGED POSTGRESQL DATABASE
  # ----------------------------------------------------------------------------
  - name: syncforge_postgres
    plan: free
    region: oregon
    databaseName: syncforge_prod
    user: syncforge_admin
    postgresMajorVersion: 16
